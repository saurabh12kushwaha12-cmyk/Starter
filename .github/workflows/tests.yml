name: Challenge tests

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile application and mock service
        run: python -m py_compile starter-solution/server.py mock-services/server.py
      - name: Syntax-check embedded browser JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path("starter-solution/server.py").read_text(encoding="utf-8")
          match = re.search(r"<script>(.*?)</script>", source, re.DOTALL)
          if not match:
              raise SystemExit("Embedded browser script was not found")
          Path("/tmp/gemini-cx-ui.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/gemini-cx-ui.js
      - name: Validate challenge JSON resources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path("sample-data").glob("*.json"))
          files += list(Path("scenarios").glob("*.json"))
          files += list(Path("schemas").glob("*.json"))
          files += list(Path("failure-config").glob("*.json"))
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"Validated {len(files)} JSON files")
          PY
      - name: Run automated challenge tests
        run: python -m unittest discover -s starter-solution/tests -v
