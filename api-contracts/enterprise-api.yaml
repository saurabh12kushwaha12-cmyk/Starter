openapi: 3.0.3
info:
  title: Synthetic Telecom APIs
  version: 1.1.0
  description: >
    Challenge-only synthetic APIs. Login returns a random, short-lived opaque bearer token.
    All data/action endpoints except health and login require bearer authentication and enforce
    customer ownership or the synthetic support-agent role. Support-case idempotency keys are
    bound to the original customer, account and request payload; conflicting reuse returns HTTP 409.
servers:
  - url: http://127.0.0.1:8090
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Synthetic token returned by /api/auth/login; never a real credential.
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string, writeOnly: true}
    LoginResponse:
      type: object
      required: [accessToken, customerId, roles, expiresIn]
      properties:
        accessToken: {type: string, writeOnly: true}
        customerId: {type: string}
        accountId: {type: string, nullable: true}
        roles:
          type: array
          items: {type: string}
        expiresIn: {type: integer}
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
paths:
  /health:
    get:
      summary: Mock service health
      responses:
        '200':
          description: Healthy
  /api/auth/login:
    post:
      summary: Authenticate a synthetic reviewer user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Authenticated; keep accessToken server-side
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '401':
          description: Invalid credentials
        '503':
          description: Mock authentication service unavailable
  /api/customers/{customerId}:
    get:
      security: [{BearerAuth: []}]
      summary: Get own customer profile (support-agent role may inspect a customer)
      parameters:
        - in: path
          name: customerId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Profile found; credential fields are not returned}
        '401': {description: Bearer token required or invalid}
        '403': {description: Customer ownership denied}
        '404': {description: Profile not found}
  /api/accounts/{accountId}:
    get:
      security: [{BearerAuth: []}]
      summary: Get an authorized account
      parameters:
        - in: path
          name: accountId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Account found}
        '401': {description: Bearer token required or invalid}
        '403': {description: Account ownership denied}
        '404': {description: Account not found}
  /api/accounts/{accountId}/billing:
    get:
      security: [{BearerAuth: []}]
      summary: Get billing for an authorized account
      parameters:
        - in: path
          name: accountId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Billing record}
        '401': {description: Bearer token required or invalid}
        '403': {description: Account ownership denied}
        '404': {description: Billing record not found}
        '503': {description: Billing service unavailable}
  /api/network/outages:
    get:
      security: [{BearerAuth: []}]
      summary: Get network status for the authenticated customer's postal code and optionally a service type owned by that customer
      parameters:
        - in: query
          name: postalCode
          required: true
          schema: {type: string}
        - in: query
          name: serviceType
          required: false
          schema: {type: string, enum: [home-internet, mobile]}
      responses:
        '200': {description: Network status scoped to the requested service type when supplied}
        '401': {description: Bearer token required or invalid}
        '403': {description: Postal-code ownership denied}
  /api/diagnostics:
    post:
      security: [{BearerAuth: []}]
      summary: Run synthetic service diagnostics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceId]
              properties:
                serviceId: {type: string}
      responses:
        '200': {description: Diagnostic result}
        '400': {description: Invalid request}
        '401': {description: Bearer token required or invalid}
        '403': {description: Service ownership denied}
        '503': {description: Diagnostic service unavailable or malformed mode configured}
  /api/support-cases:
    post:
      security: [{BearerAuth: []}]
      summary: Create an idempotent support case after application-level confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, accountId, summary, idempotencyKey]
              properties:
                customerId: {type: string}
                accountId: {type: string}
                summary: {type: string, maxLength: 240}
                idempotencyKey: {type: string}
      responses:
        '200': {description: Previously created case returned for duplicate idempotency key}
        '201': {description: Case created}
        '400': {description: Invalid action payload}
        '401': {description: Bearer token required or invalid}
        '403': {description: Account/customer ownership denied}
        '409': {description: Idempotency key was previously used with another account or payload}
        '503': {description: Case-management service unavailable}
  /api/legacy/subscriber-status:
    post:
      security: [{BearerAuth: []}]
      summary: Get subscriber status through the synthetic legacy XML interface
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: string
      responses:
        '200':
          description: Legacy XML response
          content:
            application/xml:
              schema: {type: string}
        '400': {description: Malformed XML request}
        '401': {description: Bearer token required or invalid}
        '403': {description: Account/service ownership denied}
        '503': {description: Legacy service unavailable}
