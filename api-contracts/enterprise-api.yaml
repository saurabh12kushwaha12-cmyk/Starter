openapi: 3.0.3
info: {title: Synthetic Telecom APIs, version: 1.0.0}
servers: [{url: http://localhost:8090}]
paths:
  /api/auth/login: {post: {summary: Authenticate synthetic user, responses: {'200': {description: Authenticated}, '401': {description: Invalid}}}}
  /api/customers/{customerId}: {get: {summary: Customer profile, responses: {'200': {description: Found}, '404': {description: Missing}}}}
  /api/accounts/{accountId}: {get: {summary: Account record, responses: {'200': {description: Found}, '404': {description: Missing}}}}
  /api/accounts/{accountId}/billing: {get: {summary: Billing record, responses: {'200': {description: Found}, '503': {description: Unavailable}}}}
  /api/network/outages: {get: {summary: Outage by postalCode, responses: {'200': {description: Status}}}}
  /api/support-cases: {post: {summary: Create idempotent case, responses: {'201': {description: Created}, '409': {description: Duplicate}, '503': {description: Unavailable}}}}
  /api/legacy/subscriber-status: {post: {summary: Legacy XML status, responses: {'200': {description: XML}, '503': {description: Unavailable}}}}
